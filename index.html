<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Flipkart clone" />
        <meta name="keywords" content="HTML, CSS, Flipkart" />
        <meta name="author" content="Krutarth Pipaliya" />
        <link rel="stylesheet" href="style.css" />
        <title>Flipkart</title>
    </head>
    <body>
        <header>
            <div id="header-left">
                <img src="assets/logo.png" alt="logo">
                <search id="header-search">
                    <input type="text" placeholder="Search for products, brands and more">
                    <img src="assets/search-blue.svg">
                </search>
            </div>
            <div id="header-right">
                <nav id="header-right-nav">
                    <ul id="header-right-nav-list">
                        <li class="header-right-nav-list-item login">
                            Login
                        </li>
                        <li class="header-right-nav-list-item">
                            More
                            <img src="assets/down.svg">
                        </li>
                        <li class="header-right-nav-list-item">
                            <img src="assets/cart.svg">
                            Cart
                        </li>
                    </ul>
                </nav>
            </div>
            </header>
        <nav></nav>
        <main></main>
    </body>
</html>
